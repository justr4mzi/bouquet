name: fork-watch

# Every morning, lists the new commits and tags of the forks Hortensia follows (docs/HANDOFF.md)
# in the issue "Fork watch". No AI: an agent still reads them in detail before integrating.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - name: List what changed in the last day
        run: |
          set -u
          since="$(date -u -d '26 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          out=report.md
          echo "# Fork watch — $(date -u +%Y-%m-%d)" > $out
          echo "" >> $out
          echo "New commits since $since (UTC). Read them in detail before integrating; see docs/HANDOFF.md." >> $out
          git init -q scan && cd scan
          while read -r name url branches; do
            [ -z "$name" ] && continue
            refs=()
            for b in $(echo "$branches" | tr ',' ' '); do
              if [ "$b" = "*" ]; then
                while read -r _ ref; do refs+=("${ref#refs/heads/}"); done < <(git ls-remote --heads "$url" 2>/dev/null)
              else
                refs+=("$b")
              fi
            done
            section=""
            for b in "${refs[@]}"; do
              git fetch -q --depth 60 "$url" "+refs/heads/$b:refs/w/$name/$b" 2>/dev/null || continue
              log="$(git log --no-merges --since="$since" --format='- `%h` %an: %s' "refs/w/$name/$b" | head -40)"
              [ -n "$log" ] && section="$section"$'\n'"**$b**"$'\n'"$log"$'\n'
            done
            tags="$(git ls-remote --tags "$url" 2>/dev/null | grep -v '\^{}' | tail -3 | sed 's|.*refs/tags/|`|; s|$|`|' | tr '\n' ' ')"
            if [ -n "$section" ]; then
              printf '\n## %s\n%s\n%s\nLatest tags: %s\n' "$name" "$url" "$section" "$tags" >> ../$out
            fi
          done <<'EOF'
          Lichii https://github.com/zortos293/Lichii.git *
          Eglantine https://github.com/Djihads80/Eglantine.git nx2,nx2-experimental
          Selevet https://github.com/sylvieistaken/selevet-eglantine.git main
          Orchid https://github.com/MythosOfs/Orchid.git main
          SmileyTatsu https://github.com/SmileyTatsu/Eglantine.git smileytatsu/dev-rebased
          notsapinho https://github.com/notsapinho/Eglantine.git main,dev
          Jonas https://github.com/jojo-chaechae/Eglantine.git oot-jojo
          Frizti https://github.com/Frizti/Lichii.git oot-gather-fix,nx2
          chuppatricky https://github.com/chuppatricky/Lichii.git *
          Eglantine-DKB https://github.com/monteger8/Eglantine-DKB.git dkb-terrain
          KektJ https://github.com/KektJ/Eglantine.git perf/crowded-areas
          Wael3rd https://github.com/Wael3rd/Eglantine-MKW.git mkw-eglantine
          eden-fefw https://github.com/xDarkWindx/eden-fefw.git main
          wichforks https://github.com/riyadhHDA/wichforks.git main
          EOF
          cd ..
          if [ "$(wc -l < $out)" -le 3 ]; then echo "" >> $out; echo "Nothing new." >> $out; fi
          cat $out

      - name: Update the Fork watch issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          num="$(gh issue list --state open --search 'Fork watch in:title' --json number -q '.[0].number')"
          if [ -z "$num" ]; then
            gh issue create --title "Fork watch" --body-file report.md
          else
            gh issue edit "$num" --body-file report.md
            gh issue comment "$num" --body "Updated $(date -u +%Y-%m-%d)."
          fi
